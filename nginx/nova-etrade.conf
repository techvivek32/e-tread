# NOVA E*TRADE — nginx site
#
# Install as /etc/nginx/sites-available/nova-etrade and symlink into sites-enabled.
# NEVER edit /etc/nginx/sites-enabled/<live IBKR site> while doing this.
#
#   ln -s /etc/nginx/sites-available/nova-etrade /etc/nginx/sites-enabled/nova-etrade
#   nginx -t && systemctl reload nginx
#
# Certificates:
#   certbot --nginx -d APP_DOMAIN -d backend-APP_DOMAIN
#
# The proxy binds to 127.0.0.1 only — it is never reachable from the internet except through
# this block, which is what keeps the trading API behind TLS and the origin allow-list.

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN backend-APP_DOMAIN;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------ the web app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # Alert engine — the SAME TradeScope service the IBKR build uses. It is broker-agnostic,
    # so there is nothing to fork or duplicate.
    location /ts-api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:7180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --------------------------------------------------------------- the broker proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend-APP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/backend-APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend-APP_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    # Order submission is a single request that internally does preview -> place -> verify
    # (6 polls x 1.5s). Give it room; a timeout here would leave the trader unsure whether
    # an order landed, which is the exact ambiguity the verification exists to remove.
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
